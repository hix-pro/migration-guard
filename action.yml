name: Migration Guard
description: >-
  Statically catch destructive SQL migrations and table-locking operations
  before they ship. Never connects to a database.
branding:
  icon: alert-triangle
  color: red

inputs:
  paths:
    description: One or more .sql files or directories, space-separated (directories are scanned recursively).
    required: false
    default: '.'
  dialect:
    description: 'SQL dialect used to parse statements: postgres or mysql.'
    required: false
    default: postgres
  fail-on:
    description: >-
      Exit 2 when findings reach this severity: destructive, risky, or warning
      (inclusive). Leave empty for report-only mode.
    required: false
    default: ''
  args:
    description: Extra arguments passed through to `migration-guard check`.
    required: false
    default: ''
  sarif:
    description: >-
      Write and upload a SARIF report for GitHub code scanning. Requires
      `security-events: write` in the caller workflow.
    required: false
    default: 'true'
  category:
    description: Category used to separate SARIF results from multiple runs.
    required: false
    default: migration-guard

runs:
  using: composite
  steps:
    # Prefers the prebuilt binary attached to the release matching the action
    # ref (e.g. @v0.3.1). Anything else — a branch or SHA ref, `uses: ./`,
    # an unsupported platform, or a release without binaries — falls back to
    # building from source below.
    - name: Try prebuilt binary
      id: prebuilt
      shell: bash
      continue-on-error: true
      env:
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPO: ${{ github.action_repository }}
      run: |
        set -euo pipefail
        case "$ACTION_REF" in
          refs/tags/v[0-9]*) tag="${ACTION_REF#refs/tags/}" ;;
          v[0-9]*) tag="$ACTION_REF" ;;
          *)
            echo "action ref '$ACTION_REF' is not a version tag; building from source"
            exit 1
            ;;
        esac
        os="$(uname -s)"
        arch="$(uname -m)"
        windows=false
        case "$os" in
          Linux)
            target="x86_64-unknown-linux-gnu"
            ;;
          Darwin)
            if [[ "$arch" == "arm64" ]]; then
              target="aarch64-apple-darwin"
            else
              target="x86_64-apple-darwin"
            fi
            ;;
          MINGW*|MSYS*|CYGWIN*)
            target="x86_64-pc-windows-msvc"
            windows=true
            ;;
          *)
            echo "unsupported platform ($os/$arch); building from source"
            exit 1
            ;;
        esac
        suffix=""
        if [[ "$windows" == "true" ]]; then
          suffix=".exe"
        fi
        asset="migration-guard-${target}.tar.gz"
        url="https://github.com/${ACTION_REPO}/releases/download/${tag}/${asset}"
        tmp="$(mktemp -d)"
        echo "downloading $url"
        curl -fsSL "$url" -o "$tmp/$asset"
        tar -xzf "$tmp/$asset" -C "$tmp"
        bin_dir="$RUNNER_TEMP/hix-bin"
        if command -v cygpath >/dev/null 2>&1; then
          bin_dir="$(cygpath -u "$RUNNER_TEMP")/hix-bin"
        fi
        mkdir -p "$bin_dir"
        install "$tmp/migration-guard-${target}/migration-guard${suffix}" "$bin_dir/"
        "$bin_dir/migration-guard${suffix}" --version
        echo "$bin_dir" >> "$GITHUB_PATH"
        echo "found=true" >> "$GITHUB_OUTPUT"
        echo "installed prebuilt binary for $target"

    - name: Install Rust toolchain
      if: ${{ steps.prebuilt.outputs.found != 'true' }}
      uses: dtolnay/rust-toolchain@stable

    - name: Install Migration Guard from source
      if: ${{ steps.prebuilt.outputs.found != 'true' }}
      shell: bash
      run: cargo install --locked --path "$GITHUB_ACTION_PATH"

    - name: Run Migration Guard
      id: scan
      shell: bash
      continue-on-error: true
      env:
        MG_PATHS: ${{ inputs.paths }}
        MG_DIALECT: ${{ inputs.dialect }}
        MG_FAIL_ON: ${{ inputs.fail-on }}
        MG_ARGS: ${{ inputs.args }}
        SARIF_ENABLED: ${{ inputs.sarif }}
        SARIF_FILE: ${{ runner.temp }}/migration-guard.sarif
      run: |
        args=(--dialect "$MG_DIALECT")
        if [[ -n "$MG_FAIL_ON" ]]; then
          args+=(--fail-on "$MG_FAIL_ON")
        fi
        set +e
        if [[ "$SARIF_ENABLED" == "true" ]]; then
          # MG_PATHS and MG_ARGS are deliberately word-split: callers may pass
          # several paths and flags in one input.
          # shellcheck disable=SC2086
          migration-guard check $MG_PATHS "${args[@]}" --format sarif $MG_ARGS > "$SARIF_FILE"
        else
          # shellcheck disable=SC2086
          migration-guard check $MG_PATHS "${args[@]}" $MG_ARGS
        fi
        code=$?
        set -e
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        exit "$code"

    - name: Upload SARIF
      if: ${{ always() && inputs.sarif == 'true' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/migration-guard.sarif
        category: ${{ inputs.category }}
        wait-for-processing: false

    - name: Preserve scan result
      if: ${{ steps.scan.outputs.exit_code != '0' }}
      shell: bash
      env:
        EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
      run: exit "$EXIT_CODE"
